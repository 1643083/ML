<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h2>neural network</h2>
  <p>identifica el color predominante - rgb</p>

  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.2/lib/p5.js"></script>
  <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>

  <script>
    //entrenar - datos
    let data = [
      { r: 255, g: 0, b: 0, color: "rojo" },
      { r: 254, g: 0, b: 0, color: "rojo" },
      { r: 253, g: 0, b: 0, color: "rojo" },
      { r: 0, g: 255, b: 0, color: "verde" },
      { r: 0, g: 254, b: 0, color: "verde" },
      { r: 0, g: 253, b: 0, color: "verde" },
      { r: 0, g: 0, b: 255, color: "azul" },
      { r: 0, g: 0, b: 254, color: "azul" },
      { r: 0, g: 0, b: 253, color: "azul" }
    ]

    //objetos
    let classifier //ml5
    let r = 255
    let g = 0
    let b = 0

    let rSlider, gSlider, bSlider
    let label = 'entrenando...'

    //configuración de todo el entorno
    function setup(){
      createCanvas(640, 240)
      ml5.setBackend("webgl") //motor gráfico

      //crear sliders
      //createSlider(min, max, actual)
      //position es el lugar dentro del canvas
      rSlider = createSlider(0, 255, 255).position(10, 20)
      gSlider = createSlider(0, 255, 0).position(10, 40)
      bSlider = createSlider(0, 255, 0).position(10, 60)

      //asignar una red neuronal
      //debug = true permite ver el entrenamiento
      let options = {
        task: "classification",
        debug: true
      }

      //inicializar la red neuronal
      classifier = ml5.neuralNetwork(options)

      //facilitarle los datos
      for (let i = 0; i < data.length; i++){
        let item = data[i]
        let inputs = [item.r, item.g, item.b]
        let outputs = [item.color]

        //red neuronal => datos de entrenamiento - resultado que esperamos obtener
        classifier.addData(inputs, outputs)
      }

      //normalización de datos (verificación)
      classifier.normalizeData()

      //entrenamiento
      let trainingOptions = {
        epochs: 32,
        batchSize: 12
      }

      classifier.train(trainingOptions, finishedTraining)
    }

    //cuando el modelo esté entrenado
    function finishedTraining(){
      classify()
    }

    //clasificación - identificación
    function classify(){
      let input = [r, g, b] //array
      classifier.classify(input, handResults) //¿qué color estás viendo?
    }

    //render en el lienzo
    function draw(){
      //recibir los valores de los slider
      r = rSlider.value()
      g = gSlider.value()
      b = bSlider.value()

      background(r, g, b) //lienzo se configura de acuerdo al slider
      textAlign(CENTER, CENTER)
      textSize(64)
      text(label, width/2, height/2)
    }

    //gestión del resultado o error
    function handResults(results, error){
      if (error){
        console.error(error)
        return
      }

      label = results[0].label
      classify()
    }

  </script>
</body>
</html>
